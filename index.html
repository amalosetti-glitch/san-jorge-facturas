<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargar documento — San Jorge</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2F4A2B">
<style>
  body{
    font-family:'Inter',Arial,sans-serif;
    background:#EFE8D8;
    color:#2B2620;
    margin:0;
    padding:24px 18px 60px;
  }
  h1{font-size:20px;margin:0 0 4px;}
  p.sub{color:#5B5344;font-size:14px;margin:0 0 24px;}
  .card{
    background:#F8F3E6;
    border:1px solid #CBBFA2;
    border-radius:6px;
    padding:18px;
    margin-bottom:16px;
  }
  input[type=file]{
    display:block;width:100%;padding:12px;
    border:1.5px dashed #CBBFA2;border-radius:6px;
    background:#fff;font-size:14px;
  }
  button{
    width:100%;padding:14px;border:none;border-radius:6px;
    font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;
  }
  .btn-primary{background:#2F4A2B;color:#F3EEDF;}
  .btn-confirm{background:#3F6B3D;color:#fff;}
  button:disabled{opacity:0.5;cursor:default;}
  label{
    display:block;font-size:12px;text-transform:uppercase;
    letter-spacing:0.05em;color:#5B5344;margin:12px 0 4px;
  }
  input[type=text], input[type=number], select{
    width:100%;padding:10px;border:1px solid #CBBFA2;
    border-radius:4px;font-size:15px;box-sizing:border-box;
  }
  #tipoDocumento{font-weight:600;border-color:#2F4A2B;}
  #estado{font-size:14px;color:#5B5344;margin-top:10px;text-align:center;}
  #revision, #ok{display:none;}
  #ok{text-align:center;padding:30px 10px;}
  #ok .check{font-size:40px;}
</style>
</head>
<body>

  <h1>Cargar documento</h1>
  <p class="sub">San Jorge — Ascensión, Buenos Aires</p>

  <div class="card" id="paso1">
    <label>Foto o PDF (factura, carta de porte o liquidación)</label>
    <input type="file" id="archivo" accept="application/pdf,image/*" capture="environment">
    <button class="btn-primary" id="btnLeer" onclick="leer()">Leer documento</button>
    <p id="estado"></p>
  </div>

  <div class="card" id="revision">
    <p class="sub" style="margin-bottom:14px;">Revisá los datos antes de guardar:</p>

    <label>Tipo de documento</label>
    <select id="tipoDocumento" onchange="mostrarCamposSegunTipo()">
      <option value="Factura">Factura</option>
      <option value="Carta de Porte">Carta de Porte</option>
      <option value="Liquidación">Liquidación</option>
    </select>

    <label>Fecha</label>
    <input type="text" id="fecha">

    <div id="camposFactura">
      <label>Proveedor</label>
      <input type="text" id="proveedor">
      <label>CUIT proveedor</label>
      <input type="text" id="cuit" placeholder="XX-XXXXXXXX-X">
      <label>Concepto</label>
      <input type="text" id="concepto">
      <label>Rubro</label>
      <input type="text" id="rubro">
      <label>Nº de factura</label>
      <input type="text" id="nroFactura">
      <label>Monto ($)</label>
      <input type="number" id="monto">
      <label>¿Ya la pagaste?</label>
      <div style="display:flex;gap:16px;margin-top:4px;">
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:normal;font-size:15px;color:#2B2620;">
          <input type="radio" name="yaPagada" value="no" checked onchange="togglePago()"> No
        </label>
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:normal;font-size:15px;color:#2B2620;">
          <input type="radio" name="yaPagada" value="si" onchange="togglePago()"> Sí
        </label>
      </div>
      <div id="bloqueFormaPago" style="display:none;">
        <label>Forma de pago</label>
        <select id="formaDePago">
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Tarjeta">Tarjeta</option>
        </select>
      </div>
    </div>

    <div id="camposCartaPorte">
      <label>Grano</label>
      <input type="text" id="granoCartaPorte">
      <label>Nº Carta de Porte</label>
      <input type="text" id="nroCartaPorte">
      <label>Razón social comprador</label>
      <input type="text" id="razonSocialComprador">
      <label>Transportista</label>
      <input type="text" id="transportista">
      <label>Puerto destino</label>
      <input type="text" id="puertoDestino">
      <label>Destinatario</label>
      <input type="text" id="destinatario">
      <label>Kg cargados</label>
      <input type="number" id="kgCargados">
    </div>

    <div id="camposLiquidacion">
      <label>Nº Liquidación</label>
      <input type="text" id="nroLiquidacion">
      <label>Nº Contrato</label>
      <input type="text" id="contrato">
      <label>Cereal</label>
      <input type="text" id="cereal">
      <label>Cantidad (Tn)</label>
      <input type="number" id="cantidadTn">
      <label>Razón social comprador</label>
      <input type="text" id="razonSocialCompradorLiq">
      <label>Precio (por tn)</label>
      <input type="number" id="precio">
      <label>Monto total ($)</label>
      <input type="number" id="montoLiquidacion">
      <label>Flete descontado ($) — si corresponde</label>
      <input type="number" id="fleteLiquidacion">
      <label>Tipo de liquidación</label>
      <select id="tipoLiquidacion">
        <option value="Liquidación">Liquidación (venta normal)</option>
        <option value="Liquidación de Consumo">Liquidación de Consumo</option>
      </select>
    </div>

    <button class="btn-confirm" id="btnGuardar" onclick="guardar()">Confirmar y guardar</button>
  </div>

  <div class="card" id="ok">
    <div class="check">✓</div>
    <p id="okTexto">Documento cargado.</p>
    <button class="btn-primary" onclick="location.href='./index.html'">Cargar otro</button>
  </div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwfcjBDQ_OI0j3xD8TwRf5RRWygrCVYzUgTxHfrGmFqPkhuIxo08m4Oi0XiLrO7vqUb/exec';

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }

  async function llamarBackend(accion, extra){
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 45000);
    let resp;
    try {
      resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ accion }, extra)),
        signal: controller.signal
      });
    } catch (err) {
      if (err.name === 'AbortError') {
        throw new Error('El servidor tardó demasiado en responder. Probá de nuevo.');
      }
      throw err;
    } finally {
      clearTimeout(timeoutId);
    }
    const json = await resp.json();
    if (!json.ok) throw new Error(json.error || 'Error desconocido');
    return json.datos;
  }

  function leerArchivo(file){
    document.getElementById('btnLeer').disabled = true;
    document.getElementById('estado').textContent = 'Leyendo documento, un momento...';

    const pareceSerPdf = file.type === 'application/pdf' ||
      (file.name || '').toLowerCase().endsWith('.pdf');

    if(pareceSerPdf){
      const reader = new FileReader();
      reader.onerror = () => mostrarErrorLectura('No se pudo leer el archivo.');
      reader.onload = e => procesarLectura(e.target.result.split(',')[1], 'application/pdf', file.name);
      reader.readAsDataURL(file);
      return;
    }

    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => mostrarErrorLectura('No se pudo leer el archivo.');
    reader.onload = function(e){
      img.onerror = () => mostrarErrorLectura('El archivo no es una foto ni un PDF válido. Probá elegirlo de nuevo desde "Seleccionar archivo".');
      img.onload = function(){
        const maxAncho = 1600;
        const escala = Math.min(1, maxAncho / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * escala;
        canvas.height = img.height * escala;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        procesarLectura(dataUrl.split(',')[1], 'image/jpeg', file.name);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function leer(){
    const input = document.getElementById('archivo');
    if(!input.files.length){
      document.getElementById('estado').textContent = 'Elegí un archivo primero.';
      return;
    }
    leerArchivo(input.files[0]);
  }

  function mostrarErrorLectura(mensaje){
    document.getElementById('btnLeer').disabled = false;
    document.getElementById('estado').textContent = 'Error: ' + mensaje;
  }

  let ultimoResultadoIA = null;

  async function procesarLectura(base64, mimeType, nombreArchivo){
    try{
      const datos = await llamarBackend('leer', { base64, mimeType, nombreArchivo });
      document.getElementById('btnLeer').disabled = false;
      document.getElementById('estado').textContent = '';
      mostrarRevision(datos);
    } catch(err){
      mostrarErrorLectura(err.message);
    }
  }

  function togglePago(){
    const si = document.querySelector('input[name="yaPagada"]:checked').value === 'si';
    document.getElementById('bloqueFormaPago').style.display = si ? 'block' : 'none';
  }

  function mostrarCamposSegunTipo(){
    const tipo = document.getElementById('tipoDocumento').value;
    document.getElementById('camposFactura').style.display = tipo === 'Factura' ? 'block' : 'none';
    document.getElementById('camposCartaPorte').style.display = tipo === 'Carta de Porte' ? 'block' : 'none';
    document.getElementById('camposLiquidacion').style.display = tipo === 'Liquidación' ? 'block' : 'none';
  }

  function mostrarRevision(datos){
    const alertas = datos.alertas || [];
    if(alertas.length){
      const continuar = confirm('⚠️ ' + alertas.join('\n⚠️ ') + '\n\n¿Querés cargarla igual?');
      if(!continuar){
        document.getElementById('estado').textContent = 'Carga cancelada.';
        return;
      }
    }

    ultimoResultadoIA = datos;
    document.getElementById('tipoDocumento').value = datos.tipo_documento || 'Factura';
    document.getElementById('fecha').value = datos.fecha || '';

    document.getElementById('proveedor').value = datos.proveedor || '';
    document.getElementById('cuit').value = datos.cuit || '';
    document.getElementById('concepto').value = datos.concepto || '';
    document.getElementById('rubro').value = datos.rubro || '';
    document.getElementById('nroFactura').value = datos.nro_factura || '';
    document.getElementById('monto').value = datos.monto || '';
    document.querySelector('input[name="yaPagada"][value="no"]').checked = true;
    togglePago();

    document.getElementById('nroCartaPorte').value = datos.nro_carta_porte || '';
    document.getElementById('granoCartaPorte').value = datos.cereal || 'Soja';
    document.getElementById('razonSocialComprador').value = datos.razon_social_comprador || '';
    document.getElementById('transportista').value = datos.transportista || '';
    document.getElementById('puertoDestino').value = datos.puerto_destino || '';
    document.getElementById('destinatario').value = datos.destinatario || '';
    document.getElementById('kgCargados').value = datos.kg_cargados || '';

    document.getElementById('nroLiquidacion').value = datos.nro_liquidacion || '';
    document.getElementById('contrato').value = datos.contrato || '';
    document.getElementById('cereal').value = datos.cereal || 'Soja';
    document.getElementById('cantidadTn').value = datos.cantidad_tn || '';
    document.getElementById('razonSocialCompradorLiq').value = datos.razon_social_comprador || '';
    document.getElementById('precio').value = datos.precio || '';
    document.getElementById('montoLiquidacion').value = datos.monto || '';
    document.getElementById('fleteLiquidacion').value = datos.flete || '';
    document.getElementById('tipoLiquidacion').value = datos.tipo_liquidacion || 'Liquidación';

    mostrarCamposSegunTipo();
    document.getElementById('paso1').style.display = 'none';
    document.getElementById('revision').style.display = 'block';
    document.getElementById('btnGuardar').disabled = false;
  }

  async function guardar(){
    const btn = document.getElementById('btnGuardar');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const tipo = document.getElementById('tipoDocumento').value;
    const fecha = document.getElementById('fecha').value;
    const archivoOriginal = ultimoResultadoIA ? ultimoResultadoIA.archivoOriginal : '';
    let datos = { tipo_documento: tipo, fecha: fecha, archivoOriginal: archivoOriginal };

    if(tipo === 'Factura'){
      const yaPagada = document.querySelector('input[name="yaPagada"]:checked').value === 'si';
      Object.assign(datos, {
        proveedor: document.getElementById('proveedor').value,
        cuit: document.getElementById('cuit').value,
        concepto: document.getElementById('concepto').value,
        rubro: document.getElementById('rubro').value,
        nro_factura: document.getElementById('nroFactura').value,
        monto: document.getElementById('monto').value,
        estado: yaPagada ? 'Pagada' : 'Pendiente',
        formaDePago: yaPagada ? document.getElementById('formaDePago').value : ''
      });
    } else if(tipo === 'Carta de Porte'){
      Object.assign(datos, {
        nro_carta_porte: document.getElementById('nroCartaPorte').value,
        cereal: document.getElementById('granoCartaPorte').value,
        razon_social_comprador: document.getElementById('razonSocialComprador').value,
        transportista: document.getElementById('transportista').value,
        puerto_destino: document.getElementById('puertoDestino').value,
        destinatario: document.getElementById('destinatario').value,
        kg_cargados: document.getElementById('kgCargados').value
      });
    } else if(tipo === 'Liquidación'){
      Object.assign(datos, {
        nro_liquidacion: document.getElementById('nroLiquidacion').value,
        contrato: document.getElementById('contrato').value,
        cereal: document.getElementById('cereal').value,
        cantidad_tn: document.getElementById('cantidadTn').value,
        razon_social_comprador: document.getElementById('razonSocialCompradorLiq').value,
        precio: document.getElementById('precio').value,
        monto: document.getElementById('montoLiquidacion').value,
        flete: document.getElementById('fleteLiquidacion').value,
        tipo_liquidacion: document.getElementById('tipoLiquidacion').value
      });
    }

    try{
      await llamarBackend('guardar', { datos });
      document.getElementById('okTexto').textContent = tipo + ' cargada correctamente.';
      document.getElementById('revision').style.display = 'none';
      document.getElementById('ok').style.display = 'block';
    } catch(err){
      btn.disabled = false;
      btn.textContent = 'Confirmar y guardar';
      alert('Error al guardar: ' + err.message);
    }
  }

  async function revisarSiHayCompartido(){
    const params = new URLSearchParams(location.search);
    if(params.get('compartido') !== '1') return;
    try{
      const cache = await caches.open('share-target-v1');
      const resp = await cache.match('/archivo-compartido');
      if(!resp) return;
      const blob = await resp.blob();
      const nombre = resp.headers.get('X-Nombre') || 'compartido';
      await cache.delete('/archivo-compartido');
      leerArchivo(new File([blob], nombre, { type: blob.type }));
    } catch(err){
      console.error(err);
    }
  }

  revisarSiHayCompartido();
</script>

</body>
</html>
